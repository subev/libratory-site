<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/source-serif-4-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/cormorant-garamond-500-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Libratory — turn your books into audiobooks for free</title>
    <meta name="description" content="Turn PDFs into audiobooks for free. Read along, ask questions, translate, and get simple summaries. Use voices and AI on your own computer." />
    <meta name="theme-color" content="#16140f" />
    <link rel="canonical" href="https://libratory.dev/" />

    <!-- Without an og:image a crawler picks its own, and it picked a YouTube thumbnail -->
    <meta property="og:site_name" content="Libratory" />
    <meta property="og:title" content="Libratory — turn your books into audiobooks for free" />
    <meta property="og:description" content="Turn PDFs into audiobooks for free. Read along, ask questions, translate, and get simple summaries. Use voices and AI on your own computer." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://libratory.dev/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://libratory.dev/og.png?v=2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Libratory — turn your books into audiobooks for free" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Libratory — turn your books into audiobooks for free" />
    <meta name="twitter:description" content="Turn PDFs into audiobooks for free. Read along, ask questions, translate, and get simple summaries. Use voices and AI on your own computer." />
    <meta name="twitter:image" content="https://libratory.dev/og.png?v=2" />
    <meta name="twitter:image:alt" content="Libratory — turn your books into audiobooks for free" />
  </head>
  <body>
    <script>
      var p = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || "";
      var ua = navigator.userAgent;
      if (!/iPhone|iPad|Android/i.test(ua)) {
        // iPadOS reports a desktop UA and MacIntel; only a real Mac has no touch screen
        var mac = /Mac/i.test(p) && !navigator.maxTouchPoints;
        var os = mac ? "mac" : /Win/i.test(p) ? "win" : /Linux|X11|CrOS/i.test(p) ? "linux" : "";
        if (os) document.documentElement.dataset.os = os;
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/home.tsx"></script>
  </body>
</html>
