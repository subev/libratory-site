<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/source-serif-4-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/cormorant-garamond-500-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Libratory — turn your PDFs into audiobooks, on your own Mac</title>
    <meta name="description" content="A free, local library that turns PDF books into chapter-marked audiobooks — with AI cleanup, translations, notes and chat over everything you own. Nothing leaves your machine." />
    <meta name="theme-color" content="#16140f" />
    <link rel="canonical" href="https://libratory.dev/" />

    <!-- Without an og:image a crawler picks its own, and it picked a YouTube thumbnail -->
    <meta property="og:site_name" content="Libratory" />
    <meta property="og:title" content="Libratory — turn your PDFs into audiobooks, on your own Mac" />
    <meta property="og:description" content="A reading room for the books you already own. Chapter-marked audiobooks from your PDFs, with AI cleanup, translations, notes and chat over your whole shelf. Free and open source, and nothing leaves your machine." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://libratory.dev/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://libratory.dev/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Libratory — a reading room for the books you already own" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Libratory — turn your PDFs into audiobooks, on your own Mac" />
    <meta name="twitter:description" content="A reading room for the books you already own. Chapter-marked audiobooks from your PDFs, with AI cleanup, translations, notes and chat over your whole shelf." />
    <meta name="twitter:image" content="https://libratory.dev/og.png" />
    <meta name="twitter:image:alt" content="Libratory — a reading room for the books you already own" />
  </head>
  <body>
    <script>
      var p = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || "";
      var ua = navigator.userAgent;
      if (!/iPhone|iPad|Android/i.test(ua)) {
        var os = /Mac/i.test(p) ? "mac" : /Win/i.test(p) ? "win" : /Linux|X11|CrOS/i.test(p) ? "linux" : "";
        if (os) document.documentElement.dataset.os = os;
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/mac.tsx"></script>
  </body>
</html>
