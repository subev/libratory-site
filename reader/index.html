<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/source-serif-4-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/cormorant-garamond-500-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Libratory Reader — read and listen on your iPhone</title>
    <meta name="description" content="Listen to your books and follow each word on your iPhone. Works offline, with no account. Free, with a sample book included." />
    <meta name="theme-color" content="#16140f" />
    <link rel="canonical" href="https://libratory.dev/reader/" />

    <!-- Without an og:image a crawler picks its own, and it picked a YouTube thumbnail -->
    <meta property="og:site_name" content="Libratory" />
    <meta property="og:title" content="Libratory Reader — read and listen on your iPhone" />
    <meta property="og:description" content="Listen to your books and follow each word on your iPhone. Works offline, with no account. Free, with a sample book included." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://libratory.dev/reader/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://libratory.dev/og.png?v=2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Libratory — turn your books into audiobooks for free" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Libratory Reader — read and listen on your iPhone" />
    <meta name="twitter:description" content="Listen to your books and follow each word on your iPhone. Works offline, with no account. Free, with a sample book included." />
    <meta name="twitter:image" content="https://libratory.dev/og.png?v=2" />
    <meta name="twitter:image:alt" content="Libratory — turn your books into audiobooks for free" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/reader.tsx"></script>
  </body>
</html>
