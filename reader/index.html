    <title>Libratory Reader — the audiobook plays over the page it came from</title>
    <meta name="description" content="Libratory Reader for iPhone opens the synced EPUB the desktop app exports and plays the narration over the real printed pages — the spoken sentence lit, the word moving inside it. Offline, and no account." />

    <link rel="canonical" href="https://libratory.dev/reader/" />

    <!-- Without an og:image a crawler picks its own, and it picked a YouTube thumbnail -->

    <meta property="og:title" content="Libratory Reader — the audiobook plays over the page it came from" />
    <meta property="og:description" content="The iPhone reader for the books the desktop app makes. It plays the narration over the real print, remembers what you have heard rather than how far you got, and works with the phone in airplane mode." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://libratory.dev/reader/" />
