<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Libratory — social card</title>
    <style>
      @font-face {
        font-family: "Cormorant Garamond";
        font-weight: 500;
        src: url("../public/fonts/cormorant-garamond-500-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Fraunces";
        font-weight: 100 900;
        src: url("../public/fonts/fraunces-var-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Source Serif 4";
        font-weight: 200 900;
        src: url("../public/fonts/source-serif-4-var-latin.woff2") format("woff2");
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body { background: #16140f; }

      /* The crawler screenshots #card at exactly this size */
      #card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #16140f;
        color: #fdf1e4;
        font-family: "Source Serif 4", Georgia, serif;
      }

      /* The site's lamplight, aimed at the mark instead of the top of the page */
      #card::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(760px 620px at 17% 42%, rgb(224 145 61 / 17%), transparent 68%),
          radial-gradient(900px 560px at 88% 6%, rgb(226 96 31 / 10%), transparent 70%),
          radial-gradient(1100px 420px at 50% 118%, rgb(0 0 0 / 45%), transparent 70%);
      }

      /* A plate rule, inset the way a bookplate sits inside its page */
      .frame {
        position: absolute;
        inset: 26px;
        border: 1px solid rgb(253 241 228 / 11%);
        border-radius: 3px;
      }
      .frame::after {
        content: "";
        position: absolute;
        inset: 5px;
        border-top: 1px solid rgb(253 241 228 / 6%);
        border-bottom: 1px solid rgb(253 241 228 / 6%);
      }

      .inner {
        position: relative;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 62px;
        padding: 0 92px;
      }

      .sigil {
        position: relative;
        flex: none;
        display: grid;
        place-items: center;
        width: 256px;
      }
      /* The mark reads as lit rather than pasted on */
      .sigil::before {
        content: "";
        position: absolute;
        inset: -86px;
        background: radial-gradient(closest-side, rgb(226 96 31 / 20%), transparent 72%);
      }
      .sigil svg { position: relative; width: 256px; }

      /* Echoes the hairlines that separate every section of the site */
      .divider {
        flex: none;
        width: 1px;
        height: 264px;
        background: linear-gradient(
          to bottom,
          transparent,
          rgb(253 241 228 / 18%) 18%,
          rgb(253 241 228 / 18%) 82%,
          transparent
        );
      }

      .copy { min-width: 0; }

      .wordmark {
        display: block;
        font-family: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
        font-weight: 500;
        font-size: 78px;
        line-height: 1;
        text-transform: uppercase;
        letter-spacing: 0.34em;
        color: #fdf1e4;
      }

      .tagline {
        margin-top: 24px;
        font-family: "Fraunces", Georgia, serif;
        font-weight: 600;
        font-size: 28px;
        line-height: 1.15;
        letter-spacing: 0.01em;
        white-space: nowrap;
        color: #e0913d;
      }

      .lede {
        margin-top: 22px;
        max-width: 690px;
        font-size: 23px;
        line-height: 1.5;
        text-wrap: balance;
        color: rgb(253 241 228 / 78%);
      }

      .meta {
        margin-top: 30px;
        white-space: nowrap;
        font-family: "Fraunces", Georgia, serif;
        font-weight: 500;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: rgb(253 241 228 / 50%);
      }
      .meta b { font-weight: 500; color: #e0913d; }
      .meta i { font-style: normal; padding: 0 0.42em; color: rgb(253 241 228 / 26%); }
    </style>
  </head>
  <body>
    <div id="card">
      <div class="frame"></div>
      <div class="inner">
        <div class="sigil">
          <svg viewBox="1 9.5 62 54.5" fill="none" stroke="#fffdf9" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M30.5 15.4 L19 30.82" stroke="#e2601f" stroke-width="1.2" />
            <path d="M30.5 18 L20 32.08" stroke="#e2601f" stroke-width="1.2" />
            <path d="M30.5 20.6 L21 33.34" stroke="#e2601f" stroke-width="1.2" />
            <path d="M33.5 15.4 L45 30.82" stroke="#e2601f" stroke-width="1.2" />
            <path d="M33.5 18 L44 32.08" stroke="#e2601f" stroke-width="1.2" />
            <path d="M33.5 20.6 L43 33.34" stroke="#e2601f" stroke-width="1.2" />
            <path d="M30.5 12.4 L17 30.5" stroke-width="4" />
            <path d="M33.5 12.4 L47 30.5" stroke-width="4" />
            <circle cx="32" cy="38" r="7.4" />
            <path d="M23.4 61 Q23.4 52.6 32 52.6 Q40.6 52.6 40.6 61" />
            <path d="M25 54 L17.8 44.4" />
            <path d="M39 54 L46.2 44.4" />
            <path d="M14 36.6 Q12 38 14 39.4" stroke="#e2601f" />
            <path d="M50 36.6 Q52 38 50 39.4" stroke="#e2601f" />
            <path d="M10.4 34.6 Q8 38 10.4 41.4" stroke="#e2601f" />
            <path d="M53.6 34.6 Q56 38 53.6 41.4" stroke="#e2601f" />
            <path d="M6.8 32.6 Q3.4 38 6.8 43.4" stroke="#e2601f" />
            <path d="M57.2 32.6 Q60.6 38 57.2 43.4" stroke="#e2601f" />
          </svg>
        </div>

        <div class="divider"></div>

        <div class="copy">
          <span class="wordmark">Libratory</span>
          <p class="tagline">A reading room for the books you already own</p>
          <p class="lede">
            PDFs become chapter-marked audiobooks — then stay a library you can clean up,
            translate, search and ask. Nothing leaves your machine.
          </p>
          <p class="meta">
            <b>libratory.dev</b><i>·</i>Free for noncommercial use<i>·</i>Source on GitHub
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
